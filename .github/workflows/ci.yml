name: Public Repo CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0
      - name: Check out Public Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # actions/setup-node v5.0.0
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0

      # oven-sh/setup-bun v2.2.0
      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Use reviewed npm CLI
        run: npm install --global npm@11.18.0 --registry https://registry.npmjs.org/

      - name: Log toolchain versions
        run: |
          node --version
          npm --version
          bun --version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Verify Public Repo on Linux
        run: bun run verify:linux

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      # actions/checkout v5.1.0
      - name: Check out Public Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # actions/setup-node v5.0.0
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0

      # oven-sh/setup-bun v2.2.0
      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Use reviewed npm CLI
        run: npm install --global npm@11.18.0 --registry https://registry.npmjs.org/

      - name: Log toolchain versions
        run: |
          node --version
          npm --version
          bun --version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Verify Public Repo on macOS
        run: bun run verify:macos
